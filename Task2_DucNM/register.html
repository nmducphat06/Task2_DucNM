<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a class="logo" href="index.html">Management System</a>
        <div>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <div class="form-card">
        <h1>Create an Account</h1>
        <form id="registerForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Your name">

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="name@example.com">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 6 characters">

            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" placeholder="Enter password again">

            <button type="submit">Create Account</button>
        </form>
        <p id="message"></p>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let confirm = document.getElementById("confirm").value;
            let message = document.getElementById("message");

            if (name == "" || email == "" || password == "" || confirm == "") {
                message.textContent = "Please fill in all fields.";
            } else if (password.length < 6) {
                message.textContent = "Password must have at least 6 characters.";
            } else if (password != confirm) {
                message.textContent = "Passwords do not match.";
            } else {
                message.textContent = "Account created. You can now login.";
            }
        });
    </script>
</body>
</html>
